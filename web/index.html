  <!-- Razorpay Web Checkout -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.openRazorpayWebCheckout = function (options, onSuccess, onError) {
      try {
        var opts = Object.assign({}, options);
        opts.handler = function (response) {
          if (onSuccess) {
            onSuccess(
              response.razorpay_payment_id || '',
              response.razorpay_order_id || '',
              response.razorpay_signature || ''
            );
          }
        };
        opts.modal = {
          ondismiss: function() {
            if (onError) onError('Payment cancelled by user');
          }
        };
        var rzp = new window.Razorpay(opts);
        rzp.on('payment.failed', function (response){
          if (onError) onError((response && response.error && response.error.description) || 'Payment failed');
        });
        rzp.open();
      } catch (err) {
        if (onError) onError(err.message || 'Razorpay initialization failed');
      }
    };

    window.toggleWebFullscreen = function () {
      try {
        var docEl = document.documentElement || document.body;
        var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
        if (!isFs) {
          var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
          if (req) {
            var promise = req.call(docEl);
            if (promise && promise.then) {
              promise.then(function() {
                if (screen.orientation && screen.orientation.lock) {
                  screen.orientation.lock('landscape').catch(function(e) {});
                }
              }).catch(function(e) {});
            } else {
              if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function(e) {});
              }
            }
          }
          return true;
        } else {
          var exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
          if (exit) {
            exit.call(document);
            if (screen.orientation && screen.orientation.unlock) {
              screen.orientation.unlock();
            }
          }
          return false;
        }
      } catch (err) {
        console.error('Web Fullscreen toggle failed:', err);
        return false;
      }
    };

    window.isWebFullscreen = function () {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
    };
  </script>
